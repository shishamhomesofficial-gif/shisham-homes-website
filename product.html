<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Shisham Homes</title>
  <link rel="shortcut icon" href="./assets/images/logo/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/style-prefix.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
  <div class="overlay" data-overlay></div>

  <header>
    <div class="header-top">
      <div class="container">
        <ul class="header-social-container">
          <li><a href="#" class="social-link"><ion-icon name="logo-facebook"></ion-icon></a></li>
          <li><a href="#" class="social-link"><ion-icon name="logo-instagram"></ion-icon></a></li>
        </ul>
        <div class="header-alert-news">
          <p><b>Shisham Homes</b> Your trusted home appliances store in Jorpati, Kathmandu</p>
        </div>
        <div class="header-top-actions">
          <select name="currency"><option value="usd">NPR</option></select>
          <select name="language"><option value="en-US">English</option></select>
        </div>
      </div>
    </div>

    <div class="header-main">
      <div class="container">
        <a href="./index.html" class="header-logo">
          <img src="./assets/images/logo/logo.svg" alt="Shisham Homes logo" width="120" height="36">
        </a>

        <div class="header-search-container">
          <input type="search" name="search" class="search-field" placeholder="Enter your product name...">
          <button class="search-btn"><ion-icon name="search-outline"></ion-icon></button>
        </div>

        <div class="header-user-actions">
          <button class="action-btn"><ion-icon name="person-outline"></ion-icon></button>
          <button class="action-btn"><ion-icon name="heart-outline"></ion-icon><span class="count">0</span></button>
          <button class="action-btn"><ion-icon name="bag-handle-outline"></ion-icon><span class="count" data-cart-count>0</span></button>
        </div>
      </div>
    </div>

    <nav class="desktop-navigation-menu">
      <div class="container">
        <ul class="desktop-menu-category-list">
          <li class="menu-category"><a href="./index.html" class="menu-title">Home</a></li>
          <li class="menu-category"><a href="./index.html" class="menu-title">Categories</a></li>
          <li class="menu-category"><a href="./index.html" class="menu-title">TV</a></li>
          <li class="menu-category"><a href="./index.html" class="menu-title">Refrigerators</a></li>
          <li class="menu-category"><a href="./index.html" class="menu-title">Cooking</a></li>
          <li class="menu-category"><a href="./index.html" class="menu-title">Laundry</a></li>
          <li class="menu-category"><a href="./index.html" class="menu-title">Hot Offers</a></li>
        </ul>
      </div>
    </nav>

    <div class="mobile-bottom-navigation">
      <button class="action-btn" data-mobile-menu-open-btn>
        <ion-icon name="menu-outline"></ion-icon>
      </button>
      <a href="./index.html" class="action-btn">
        <ion-icon name="home-outline"></ion-icon>
      </a>
      <button class="action-btn">
        <ion-icon name="bag-handle-outline"></ion-icon>
        <span class="count" data-cart-count>0</span>
      </button>
    </div>

    <nav class="mobile-navigation-menu has-scrollbar" data-mobile-menu>
      <div class="menu-top">
        <h2 class="menu-title">Menu</h2>
        <button class="menu-close-btn" data-mobile-menu-close-btn><ion-icon name="close-outline"></ion-icon></button>
      </div>
      <ul class="mobile-menu-category-list">
        <li class="menu-category"><a href="./index.html" class="menu-title">Home</a></li>
        <li class="menu-category"><a href="./index.html" class="menu-title">Categories</a></li>
        <li class="menu-category"><a href="./checkout.html" class="menu-title">Checkout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="ecommerce-section">
      <div class="container product-page-layout" data-product-page>
        <div class="detail-images" data-product-page-images>
          <img src="./assets/images/products/Samsung-CE76JD-B1.jpg" alt="Product image" class="detail-image" width="260" height="260">
        </div>

        <div class="detail-info">
          <p class="showcase-category" data-product-page-category>Home Appliance</p>
          <h1 data-product-page-name>Product</h1>
          <p class="detail-price" data-product-page-price>Rs. 0</p>
          <p class="product-page-description" data-product-page-description></p>

          <div class="product-page-actions">
            <button class="add-cart-btn primary-action-btn" type="button" data-product-page-checkout>Continue to Checkout</button>
            <a class="add-cart-btn primary-action-btn" href="./index.html">Back to Products</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script src="./assets/js/script.js"></script>
</body>

</html>
